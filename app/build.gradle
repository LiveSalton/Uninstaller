plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace rootProject.ext.android.applicationId
    compileSdkVersion "${rootProject.ext.android.compileSdkVersion}" as Integer
    defaultConfig {
        minSdkVersion rootProject.ext.android.minSdkVersion as Integer
        targetSdkVersion rootProject.ext.android.targetSdkVersion as Integer
        applicationId rootProject.ext.android.applicationId
        versionName rootProject.ext.android.versionName
        versionCode rootProject.ext.android.versionCode as Integer
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias "${rootProject.ext.keystore.keyAlias}"
            keyPassword "${rootProject.ext.keystore.keyPassword}"
            storeFile file("${rootProject.ext.keystore.storeFile}")
            storePassword "${rootProject.ext.keystore.storePassword}"
            println("release storeFile:" + file("${rootProject.ext.keystore.storeFile}").getAbsolutePath())
            // 使用旧版签名，禁用V2版签名模式
            v2SigningEnabled true
        }
    }
    android {
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_17
            targetCompatibility JavaVersion.VERSION_17
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
//            minifyEnabled true
//            shrinkResources true
//            zipAlignEnabled true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            if (variant.buildType == "release") {
                outputFileName = "bb" + "_release_time_" + releaseTime() + ".apk"
            }
            if (variant.buildType == "debug") {
                outputFileName = "bb" + "_debug_time_" + releaseTime() + ".apk"
            }
        }
    }
    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/proguard/androidx-annotations.pro'
        pickFirst 'lib/*/libc++_shared.so'
    }

    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = false
        }
    }

    lintOptions {
        // true:关闭lint报告的分析进度
        quiet true
        // true:错误发生后停止gradle构建
        abortOnError false
        // true:只报告error
//        ignoreWarnings true
//        // true:忽略有错误的文件的全/绝对路径(默认是true)
//        absolutePaths true
//        // true:检查所有问题点，包含其他默认关闭项
//        checkAllWarnings true
//        // true:所有warning当做error
//        warningsAsErrors true
//        // 关闭指定问题检查
//        disable 'TypographyFractions','TypographyQuotes'
//        // 打开指定问题检查
//        enable 'RtlHardcoded','RtlCompat', 'RtlEnabled'
//        // 仅检查指定问题
//        check 'NewApi', 'InlinedApi'
//        // true:error输出文件不包含源码行号
//        noLines true
//        // true：显示错误的所有发生位置，不截取
//        showAll true
//        // 回退lint设置(默认规则)
//        lintConfig file("default-lint.xml")
//        // true：生成txt格式报告(默认false)
//        textReport true
//        // 重定向输出；可以是文件或'stdout'
//        textOutput 'stdout'
//        // true：生成XML格式报告
//        xmlReport false
//        // 指定xml报告文档(默认lint-results.xml)
//        xmlOutput file("lint-report.xml")
//        // true：生成HTML报告(带问题解释，源码位置，等)
//        htmlReport true
//        // html报告可选路径(构建器默认是lint-results.html )
//        htmlOutput file("lint-report.html")
//        //  true：所有正式版构建执行规则生成崩溃的lint检查，如果有崩溃问题将停止构建
//        checkReleaseBuilds true
//        // 在发布版本编译时检查(即使不包含lint目标)，指定问题的规则生成崩溃
//        fatal 'NewApi', 'InlineApi'
//        // 指定问题的规则生成错误
//        error 'Wakelock', 'TextViewEdits'
//        // 指定问题的规则生成警告
//        warning 'ResourceAsColor'
//        // 忽略指定问题的规则(同关闭检查)
//        ignore 'TypographyQuotes'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // 最小化依赖 - 只保留绝对必要的
    implementation 'androidx.annotation:annotation:1.7.0'

    // FileProvider 需要的核心库
//    implementation 'androidx.core:core:1.12.0'

    // 语种切换框架
    implementation 'com.github.getActivity:MultiLanguages:9.5'
}

// 分析APK大小的任务
task analyzeApk {
    doLast {
        println "APK analysis complete. Check build/outputs/apk/ for the generated APK."
        println "Use 'aapt dump badging app-release.apk' to analyze the APK."
    }
}